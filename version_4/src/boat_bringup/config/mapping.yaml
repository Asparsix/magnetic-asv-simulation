bayes_fusion:
  ros__parameters:
    anomaly_topics: ['/asv1/mag/anomaly', '/asv2/mag/anomaly', '/asv3/mag/anomaly']
    map_topic: /swarm/belief/map
    peak_topic: /swarm/belief/peak
    peak_probability_topic: /swarm/belief/peak_probability
    centroid_topic: /swarm/belief/centroid
    centroid_mass_topic: /swarm/belief/centroid_mass
    centroid_spread_topic: /swarm/belief/centroid_spread
    publish_rate_hz: 2.0
    area_size_m: 1000.0
    origin_x: -500.0
    origin_y: -500.0
    cell_size_m: 20.0
    p_bg: 0.05
    p_max: 0.95
    d_half: 30.0
    # Realistic magnetometry: noise ~3 nT, peak 50 nT overhead (~25 nT at the
    # 20 m sweep). HIT at 15 nT (~5-sigma); MISS below (unused while hit_only).
    hit_threshold_nt: 15.0
    miss_threshold_nt: 5.0
    hit_only: true
    # High-probability region for the weighted centroid = cells with
    # belief >= 0.5 * peak_belief. Lower = wider blob, higher = tighter.
    centroid_threshold_frac: 0.5
    # Dipole least-squares refinement: fit A/(r^3+soft^3) to strong samples.
    fix_topic: /swarm/belief/fix
    fix_rms_topic: /swarm/belief/fix_rms
    fix_samples_topic: /swarm/belief/fix_samples
    dipole_fit_enable: true
    dipole_soft_m: 20.0
    dipole_fit_min_anomaly_nt: 10.0
    dipole_fit_min_samples: 12
    dipole_fit_max_samples: 400
    dipole_fit_guess_strength_nt: 4.0e5
