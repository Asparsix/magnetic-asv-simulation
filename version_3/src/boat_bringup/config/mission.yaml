"/**":
  ros__parameters:
    {}

"/**/mission_manager":
  ros__parameters:
    asv_id: ''
    pose_topic: pose2d
    plan_topic: plan
    state_topic: mission/state
    mode_topic: mission/mode
    info_gain_topic: mission/info_gain
    anomaly_topic: mag/anomaly
    calibration_status_topic: calibration/status
    peak_topic: /swarm/belief/peak
    peak_probability_topic: /swarm/belief/peak_probability
    centroid_topic: /swarm/belief/centroid
    belief_map_topic: /swarm/belief/map
    declare_topic: /swarm/verify/declare
    verify_request_topic: /swarm/verify/request
    verify_result_topic: /swarm/verify/result
    halt_topic: /swarm/mission/halt

    # Coverage box inset from 300 m lake shoreline
    min_x: -120.0
    max_x: 120.0
    min_y: -120.0
    max_y: 120.0
    lawnmower_spacing: 20.0
    lawnmower_asv_index: 0
    lawnmower_num_asvs: 1
    lawnmower_partition: voronoi
    # SW + SE south-boundary shoreline starts (2 ASVs)
    region_seeds: [-110.0, -110.0, 110.0, -110.0]
    control_rate_hz: 2.0

    p_enter_target_search: 0.25
    consecutive_high_p_required: 4
    peak_near_asv_radius_m: 150.0
    min_seconds_before_switch: 20.0
    require_calibration_ready: true
    force_target_search: false
    force_spiral_complete: false
    force_verify: false

    info_gain_max_steps: 45
    info_gain_min_threshold: 1.0e-5
    info_gain_peak_convergence_m: 25.0
    info_gain_radii: [10.0, 20.0, 30.0]
    info_gain_num_angles: 16
    info_gain_replan_period_s: 5.0
    info_gain_p_spiral: 0.5
    p_bg: 0.05
    p_max: 0.95
    d_half: 30.0

    spiral_ring_spacing_m: 15.0
    spiral_max_radius_m: 80.0
    spiral_step_spacing_m: 10.0
    spiral_min_duration_s: 45.0
    spiral_complete_peak_p: 0.25
    spiral_complete_radius_m: 40.0

    self_verify: true
    verify_orbit_radius_m: 20.0
    verify_orbit_points: 12
    verify_confirmations_required: 4
    verify_arrival_radius_m: 30.0
    verify_peak_tolerance_m: 50.0
    verify_confirmation_threshold_nt: 15.0
    verify_min_peak_probability: 0.30

verify_coordinator:
  ros__parameters:
    declare_topic: /swarm/verify/declare
    request_topic: /swarm/verify/request
    result_topic: /swarm/verify/result
    complete_topic: /swarm/mission/complete
    halt_topic: /swarm/mission/halt
    known_asvs: ['asv1', 'asv2']
    prefer_other_verifier: true
