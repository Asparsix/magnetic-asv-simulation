"/**/mag_driver":
  ros__parameters:
    publish_rate_hz: 20.0
    gazebo_mag_topic: mag/gazebo
    pose_topic: pose2d
    cmd_vel_topic: cmd_vel
    raw_topic: mag/raw
    frame_id: mag_link
    motor_on_threshold: 0.001
    # Gazebo has no local mag sources — mag_driver synthesizes Earth + dipole.
    # dipole_model: total_field (vector m, full ΔF=|B0+Bd|-|B0| / (r^3+s^3)) or
    # scalar_soft. Lake depth 1 m → target_z=-1. Peak ≈ 50 nT overhead.
    # s=11.5 m calibrated for 10 m lawnmower: ~14 nT @10 m, HIT≥15 @≤5 m offset.
    plant_magnetic_target: true
    dipole_model: total_field
    # Between rows at y=-85 (tracks -90/-80); ~35 m from spawn, still 5 m off-track.
    target_x: 0.0
    target_y: -85.0
    target_z: -1.0
    sensor_z: 0.0
    dipole_peak_nt: 50.0
    dipole_mx: 0.0
    dipole_my: 0.0
    dipole_mz: 0.0          # 0,0,0 → auto vertical m from peak + inclination
    earth_inclination_deg: 15.0
    earth_declination_deg: -1.0
    # Footprint s for total_field (r^3+s^3) and legacy scalar_soft.
    dipole_strength_nt: 4.0e5
    dipole_soft_m: 11.5
    # Earth's total field is ~45,000 nT; 3-axis noise ~3 nT (1-sigma).
    synthetic_background_nt: 45000.0
    synthetic_noise_nt: 3.0

"/**/mag_filter":
  ros__parameters:
    raw_topic: mag/raw
    filtered_topic: mag/filtered
    status_topic: mag/filter_status
    lowpass_window: 5
    spike_history: 20
    # Gates in realistic nT: reject only jumps >> the ~3 nT noise and the
    # smooth 1/r^3 gradient (a few nT per sample at survey speed).
    spike_n_sigma: 10.0
    min_std_nt: 1.0
    status_rate_hz: 1.0

"/**/calibration_node":
  ros__parameters:
    filtered_topic: mag/filtered
    anomaly_topic: mag/anomaly
    status_topic: calibration/status
    area_size_m: 300.0
    origin_x: -150.0
    origin_y: -150.0
    cell_size_m: 10.0
    num_heading_bins: 8
    min_cell_samples: 1
    # Reject learning near the dipole so ambient baseline stays clean
    # (above noise, below the ~50 nT peak so near-target cells stay out).
    reject_residual_nt: 35.0
    temporal_window: 12
    noise_floor_nt: 0.0
    ready_coverage_percent: 5.0
    ready_min_cells: 8
    freeze_baseline_when_ready: true
    status_rate_hz: 1.0
