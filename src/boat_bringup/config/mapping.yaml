bayes_fusion:
  ros__parameters:
    anomaly_topics: ['/asv1/mag/anomaly']
    map_topic: /swarm/belief/map
    peak_topic: /swarm/belief/peak
    peak_probability_topic: /swarm/belief/peak_probability
    publish_rate_hz: 2.0
    area_size_m: 300.0
    origin_x: -150.0
    origin_y: -150.0
    cell_size_m: 10.0
    p_bg: 0.05
    p_max: 0.95
    d_half: 30.0
    # Realistic magnetometry: noise ~3 nT, peak 50 nT overhead (~25 nT at the
    # 20 m sweep). HIT at 15 nT (~5-sigma); MISS below (unused while hit_only).
    hit_threshold_nt: 15.0
    miss_threshold_nt: 5.0
    hit_only: true
